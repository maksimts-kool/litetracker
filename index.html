<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hajusrakenduste sõnavara kontroll</title>
</head>
<body>
  <h1>Hajusrakenduste sõnavara kontroll</h1>

  <table border="1">
    <thead>
      <tr>
        <th>Eesti → Vene</th>
        <th>Vene → Eesti</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <!-- 1. veerg: kuvatakse eestikeelne sõna, kontrollitakse venekeelset vastet -->
        <td>
          <p>Tõlgi sõna vene keelde:</p>
          <p id="word-et"></p>
          <input type="text" id="answer-et" placeholder="Sisesta venekeelne vaste">
          <button id="check-et">Kontrolli</button>
          <p id="result-et"></p>
        </td>

        <!-- 2. veerg: vastupidine variant – venekeelne sõna, kontrollitakse eestikeelset vastet -->
        <td>
          <p>Переведи слово на эстонский:</p>
          <p id="word-ru"></p>
          <input type="text" id="answer-ru" placeholder="Sisesta eestikeelne vaste">
          <button id="check-ru">Kontrolli</button>
          <p id="result-ru"></p>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Värskendamise nupp laeb lehe uuesti ja genereerib mõlemasse veergu uue random sõna -->
  <button id="refreshBtn">Värskenda</button>

  <script src="script.js"></script>
</body>
</html>
