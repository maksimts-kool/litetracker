<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hajusrakenduste sõnavara kontroll</title>
</head>
<body>
  <h1>Hajusrakenduste sõnavara kontroll</h1>

  <p>Tõlgi sõna vene keelde:</p>
  <p id="word"></p>

  <input type="text" id="answer" placeholder="Sisesta venekeelne vaste">

  <p id="result"></p>

  <!-- Värskendamise nupp laeb lehe uuesti ja genereerib uue random sõna -->
  <button id="refreshBtn">Värskenda</button>

  <script src="script.js"></script>

</html>
